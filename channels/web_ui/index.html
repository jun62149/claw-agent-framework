<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NanoClaw Web</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            background: #f0f2f5;
            color: #333;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background: #1f2937;
            color: #fff;
            padding: 14px 20px;
            font-size: 18px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #connStatus {
            font-size: 13px;
            font-weight: 400;
            padding: 4px 10px;
            border-radius: 999px;
            background: #dc2626;
        }
        #connStatus.connected { background: #16a34a; }
        #chatbox {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .msg {
            max-width: 72%;
            padding: 10px 14px;
            border-radius: 12px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .msg.user { align-self: flex-end; background: #2563eb; color: #fff; }
        .msg.bot { align-self: flex-start; background: #fff; border: 1px solid #e5e7eb; }
        #inputbar {
            display: flex;
            gap: 10px;
            padding: 12px 16px;
            background: #fff;
            border-top: 1px solid #e5e7eb;
        }
        #input {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }
        #input:focus { border-color: #2563eb; }
        #sendBtn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
        }
        #sendBtn:disabled { background: #9ca3af; cursor: not-allowed; }
    </style>
</head>
<body>
    <header>
        <span>NanoClaw Web</span>
        <span id="connStatus">断开连接</span>
    </header>

    <div id="chatbox"></div>

    <div id="inputbar">
        <input id="input" type="text" placeholder="输入消息，按 Enter 发送" autocomplete="off" />
        <button id="sendBtn">发送</button>
    </div>

    <script>
        const chatbox = document.getElementById('chatbox');
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('sendBtn');
        const connStatus = document.getElementById('connStatus');
        let ws = null;

        function appendMsg(text, who) {
            const div = document.createElement('div');
            div.className = 'msg ' + who;
            div.textContent = text;
            chatbox.appendChild(div);
            chatbox.scrollTop = chatbox.scrollHeight;
        }

        function setStatus(connected) {
            connStatus.textContent = connected ? '已连接' : '断开连接';
            connStatus.className = connected ? 'connected' : '';
        }

        function connect() {
            const protocol = location.protocol === 'https:' ? 'wss' : 'ws';
            ws = new WebSocket(`${protocol}://${location.host}/ws`);

            ws.onopen = () => setStatus(true);
            ws.onclose = () => setStatus(false);
            ws.onerror = () => setStatus(false);
            ws.onmessage = (e) => appendMsg(e.data, 'bot');
        }

        function send() {
            const text = input.value.trim();
            if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
            appendMsg(text, 'user');
            ws.send(text);
            input.value = '';
        }

        sendBtn.addEventListener('click', send);
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') send();
        });

        connect();
    </script>
</body>
</html>
